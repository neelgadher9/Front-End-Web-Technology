<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt("To Find Factorial, Enter number : "));
        let answer = 1;
        for(i=a;i>1;i--){
            answer*=i;
        }
            alert("Factorial of "+a+" is "+answer);
    </script>
</body>
</html>
