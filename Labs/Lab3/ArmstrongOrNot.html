<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("To check Armstrong or not , Enter a number : "))
        let temp = num //153
        let digits=0
        while(temp > 0){
            digits++ //1 2...
            temp = Math.floor(temp / 10) //15 1
        }
        temp = num //153
        let Anum = 0
        let pow = 1
        while(temp > 0){ //153 15...
            let rem = temp % 10 //3 5...
            for(i=0;i<digits;i++){
                for(i=0;i<digits;i++){
                    pow = pow * rem //1*3*3*3...
                }
                Anum = Anum + pow //27...
                pow=1
            }
            temp = Math.floor(temp / 10) //15 1...
        }
        if(Anum == num){
            document.write("Armstrong Number ! ")
        }
        else{
            document.write("Not an Armstrong Number ! ")
        }
    </script>
</body>
</html>
