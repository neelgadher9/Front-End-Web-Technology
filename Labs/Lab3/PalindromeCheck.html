<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = parseInt(prompt("Enter a number : "))
        let orignalNum = n
        let newRem=0,rem=0
        while(n>10){
            rem = n % 10
            n = Math.floor(n / 10)
            newRem = newRem*10 + rem
        }
        newRem = newRem*10 + n
        if(newRem == orignalNum){
            document.write("Palindrome Number !")
        }
        else{
            document.write("Not a Palindrome !")
        }
    </script>
</body>

</html>
