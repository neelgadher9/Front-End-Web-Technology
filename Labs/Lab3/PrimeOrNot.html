<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt("Enter a number to Check wheather it is Prime or Not : "));
        let count = 0;
        for(i=2;i<a;i++){
            if(a%i==0){
                count++;
                alert("It is not a Prime Number !");
                break;
            }
        }
        if(count==0){
            alert("It is a Prime Number ! ");
        }
    </script>
</body>
</html>
