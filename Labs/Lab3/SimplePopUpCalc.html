<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt("Enter Number 1 : "));
        let b = parseFloat(prompt("Enter Number 2 : "));
        let operator = prompt("Enter Operation you want : ");
        switch(operator){
            case '+' :  alert("Number 1 + Number 2 ="+(a+b));
                        break;
                      
            case '*' :  alert("Number 1 * Number 2 ="+(a*b));
                        break;
                      
            case '-' :  alert("Number 1 - Number 2 ="+(a-b));
                        break;
                      
            case '/' :  alert("Number 1 / Number 2 ="+(a/b));        
                        break;
        }
    </script>
</body>
</html>
